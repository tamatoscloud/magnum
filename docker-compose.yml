services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: magnum
      POSTGRES_PASSWORD: magnum
      POSTGRES_DB: magnum
    ports:
      - "5433:5432"
    volumes:
      - magnum_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U magnum -d magnum"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: magnum
      MINIO_ROOT_PASSWORD: magnumsecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - magnum_minio:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 magnum magnumsecret; do sleep 2; done
        mc mb -p local/magnum-documents || true
        exit 0

  web:
    profiles: ["app"]
    build: .
    command: ["pnpm", "start"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://magnum:magnum@postgres:5432/magnum
      REDIS_URL: redis://redis:6379
      STORAGE_ENDPOINT: http://minio:9000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    profiles: ["app"]
    build: .
    command: ["pnpm", "worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://magnum:magnum@postgres:5432/magnum
      REDIS_URL: redis://redis:6379
      STORAGE_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  magnum_pg:
  magnum_minio:
